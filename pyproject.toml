[build-system]
requires = ["setuptools>=61,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "talos-te-sbjat"
authors = [
    {name = "Will Koester", email = "wikoeste@cisco.com"}
]
description = "SBRS Jira Automation Tool"
version = "1.6.10"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "jira>=3.4",
    "netaddr>=0.8",
    "python-dotenv>=1.0",
    "requests>=2.28",
    "urllib3>=1.26,<2",
]

[project.urls]
Repository = "https://github.com/wikoeste/talos-te-sbjat"

[project.scripts]
talos-te-sbjat = "sbjat.main:main"
